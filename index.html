<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Backward Clock">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="styles.css">
<title>Backward Clock V3</title></head>
<body><main id="app" class="lockscreen">
<div id="wallpaper" class="wallpaper"></div><div class="shade"></div>
<header class="statusbar"><span>Türk Telekom</span><div class="status-right"><span>▮▮▮</span><span>⌁</span><span id="battery">45%</span></div></header>
<section class="stage"><div id="date" class="date"></div><div id="clock" class="clock"></div><div id="widgets" class="widgets"></div></section>
<button id="flashlight" class="round-action">▮</button><button id="camera" class="round-action camera-action">●</button>
<div class="home-indicator"></div><button id="settingsBtn" class="settings-btn">⚙︎</button>
<div id="hint" class="hint">Elini ekrandan geçir</div>
<section id="settings" class="settings-panel"><div class="settings-card">
<div class="settings-head"><h1>Backward Clock</h1><button id="closeSettings">Kapat</button></div>
<label class="file-row"><span>Duvar kâğıdı</span><input id="wallpaperInput" type="file" accept="image/*"></label>
<div class="setting-grid"><label>Widget taşıma <input id="editMode" type="checkbox"></label><label>Kamera <input id="cameraMode" type="checkbox"></label></div>
<h2>Widget'lar</h2><div id="widgetToggles" class="widget-toggles"></div>
<div class="settings-actions"><button id="resetLayout">Yerleşimi sıfırla</button><button id="saveSettings">Kaydet</button></div>
<p class="small">Düzenleme açıkken widget'ları sürükle. Konum ve duvar kâğıdı bu cihazda saklanır.</p>
</div></section><video id="cameraFeed" playsinline muted></video></main>
<script src="app.js"></script></body></html>
