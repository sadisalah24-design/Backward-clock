<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Backwards Clock</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            background-size: cover;
            background-position: center;
        }

        /* --- BAŞLANGIÇ ARAYÜZÜ (SETUP EKRANI) --- */
        #setup-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #setup-screen h1 {
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .input-group {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #aaa;
            font-size: 14px;
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 18px;
            text-align: center;
        }

        .start-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 16px 32px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
            transition: 0.2s;
        }
        
        .start-btn:active {
            transform: scale(0.95);
        }


        /* --- GÖSTERİ EKRANI (KİLİT EKRANI) --- */
        #lock-screen {
            display: none; /* Başlangıçta gizli */
            width: 100%;
            height: 100%;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.2); /* Duvar kağıdını hafif karartır */
            z-index: 1;
        }

        /* Saat ve Tarih */
        .header-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding-top: 80px; 
        }

        .date {
            font-size: 22px;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
            margin-bottom: -5px;
        }

        .time {
            font-size: 96px;
            font-weight: 200; 
            letter-spacing: -2px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* Saati geriye saran görünmez tetikleyici */
        .trick-trigger {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 200px;
            z-index: 20;
        }

        /* Yeni Doğal Widget'lar (Siyah kutu yok) */
        .widget {
            position: absolute;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
            cursor: grab;
            user-select: none;
            touch-action: none;
            min-width: 60px;
        }
        
        .widget:active { cursor: grabbing; }
        
        .widget-icon { font-size: 28px; margin-bottom: 2px; }
        .widget-text { font-size: 13px; font-weight: 600; }

        /* Fener ve Kamera */
        .bottom-controls {
            position: absolute;
            bottom: 50px; 
            width: 100%;
            padding: 0 46px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 5px;
            background-color: #fff;
            border-radius: 100px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 1. BAŞLANGIÇ ARAYÜZÜ (KURULUM) -->
    <div id="setup-screen">
        <h1>Geriye Akan Saat</h1>
        
        <div class="input-group">
            <label>Duvar Kağıdı Seç</label>
            <input type="file" id="wallpaper-input" accept="image/*">
        </div>

        <div class="input-group">
            <label>Hedef Zaman</label>
            <input type="text" id="target-time-input" placeholder="Örn: 19:57" value="19:57">
        </div>

        <button class="start-btn" onclick="startShow()">Gösteriyi Başlat</button>
    </div>


    <!-- 2. GÖSTERİ (KİLİT EKRANI) ARAYÜZÜ -->
    <div id="lock-screen">
        <div class="overlay"></div>

        <div class="header-container">
            <div class="date" id="dateDisplay">Salı, 25 Ağustos</div>
            <div class="time" id="timeDisplay">20:00</div>
            <!-- Saatin üzerindeki görünmez tetikleyici alan -->
            <div class="trick-trigger" id="trickTrigger"></div>
        </div>

        <!-- Siyah kutuları kaldırılmış, sürüklenebilir Widget'lar -->
        <div class="widget" id="widget-spotify" style="top: 280px; left: 40px;">
            <div class="widget-icon">♫</div>
            <div class="widget-text">Spotify</div>
        </div>

        <div class="widget" id="widget-weather" style="top: 280px; left: 155px;">
            <div class="widget-icon">☀️</div>
            <div class="widget-text">24°</div>
        </div>

        <div class="widget" id="widget-prayer" style="top: 280px; left: 260px;">
            <div class="widget-icon">☾</div>
            <div class="widget-text">20:31</div>
        </div>

        <div class="bottom-controls">
            <div class="icon-btn">🔦</div>
            <div class="icon-btn">📷</div>
        </div>
        
        <div class="home-indicator"></div>
    </div>

    <script>
        let realTimeInterval;
        let isTrickRunning = false;
        let trickCompleted = false;
        let finalTargetTime = "19:57";

        // GÜNCEL TARİHİ YAZDIR (Örn: Salı, 25 Ağustos)
        const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('tr-TR', dateOptions);

        // GÖSTERİYİ BAŞLAT BUTONUNA BASILINCA
        function startShow() {
            // 1. Duvar Kağıdını Uygula
            const fileInput = document.getElementById('wallpaper-input');
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.body.style.backgroundImage = `url(${e.target.result})`;
                };
                reader.readAsDataURL(fileInput.files[0]);
            }

            // 2. Hedef Zamanı Al
            const timeInput = document.getElementById('target-time-input').value;
            if (timeInput) {
                finalTargetTime = timeInput;
            }

            // 3. Ekranları Değiştir
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('lock-screen').style.display = 'block';

            // 4. Gerçek Saati Başlat ve Widget'ları Aktif Et
            startRealClock();
            activateDraggableWidgets();
        }

        // GERÇEK SAAT SİSTEMİ
        function startRealClock() {
            updateTimeDisplay();
            realTimeInterval = setInterval(updateTimeDisplay, 1000);
        }

        function updateTimeDisplay() {
            if (isTrickRunning || trickCompleted) return;
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${h}:${m}`;
        }

        // TRICK (GERİYE SARMA) SİSTEMİ
        document.getElementById('trickTrigger').addEventListener('touchstart', triggerTrick);
        document.getElementById('trickTrigger').addEventListener('mousedown', triggerTrick);

        function triggerTrick() {
            if (isTrickRunning || trickCompleted) return;
            
            clearInterval(realTimeInterval); 
            isTrickRunning = true;

            let [targetH, targetM] = finalTargetTime.split(':').map(Number);
            let targetTotalMinutes = (targetH * 60) + targetM;

            let currentTimeText = document.getElementById('timeDisplay').innerText;
            let [currentH, currentM] = currentTimeText.split(':').map(Number);
            let currentTotalMinutes = (currentH * 60) + currentM;

            let trickInterval = setInterval(() => {
                if (currentTotalMinutes <= targetTotalMinutes) {
                    clearInterval(trickInterval);
                    isTrickRunning = false;
                    trickCompleted = true;
                    if (navigator.vibrate) navigator.vibrate(50);
                    return;
                }

                currentTotalMinutes--;
                let displayH = Math.floor(currentTotalMinutes / 60);
                let displayM = currentTotalMinutes % 60;
                document.getElementById('timeDisplay').innerText = 
                    `${String(displayH).padStart(2, '0')}:${String(displayM).padStart(2, '0')}`;
                
            }, 300); // 300ms hızla geriye akar
        }

        // SÜRÜKLE BIRAK SİSTEMİ (Widget'lar için)
        function activateDraggableWidgets() {
            makeDraggable(document.getElementById("widget-spotify"));
            makeDraggable(document.getElementById("widget-weather"));
            makeDraggable(document.getElementById("widget-prayer"));
        }

        function makeDraggable(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e = e || window.event; e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function dragTouchStart(e) {
                pos3 = e.touches[0].clientX; pos4 = e.touches[0].clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementTouchDrag;
            }

            function elementDrag(e) {
                e = e || window.event; e.preventDefault();
                pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                pos3 = e.clientX; pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function elementTouchDrag(e) {
                pos1 = pos3 - e.touches[0].clientX; pos2 = pos4 - e.touches[0].clientY;
                pos3 = e.touches[0].clientX; pos4 = e.touches[0].clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null; document.onmousemove = null;
                document.ontouchend = null; document.ontouchmove = null;
            }
        }
    </script>
</body>
</html>
