<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- PWA ve Tam Ekran Ayarları -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Backwards Clock V3</title>
    
    <style>
        /* Genel Sıfırlama ve Font Ayarları */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Kaydırmayı engelle */
            height: 100vh;
            width: 100vw;
            /* Duvar kağıdını buraya ekleyebilirsin */
            background-image: url('wallpaper.jpg'); 
            background-size: cover;
            background-position: center;
        }

        /* Karartma Efekti (Yazıların okunması için) */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        /* Saat ve Tarih Alanı */
        .header-container {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-top: 80px; /* Status bar boşluğu */
        }

        .date {
            font-size: 22px;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
            margin-bottom: -5px;
        }

        .time {
            font-size: 96px;
            font-weight: 200; /* İnce iOS saati */
            letter-spacing: -2px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* Widget Havuzu ve Özgür Widget'lar */
        .widget {
            position: absolute;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            cursor: grab;
            user-select: none; /* Metin seçimini engelle */
            touch-action: none; /* Tarayıcı kaydırmasını engelle */
            opacity: 0.95;
        }
        
        .widget:active {
            cursor: grabbing;
        }

        .widget-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .widget-text {
            font-size: 14px;
            font-weight: 500;
        }

        /* Alt İkonlar (Fener ve Kamera) */
        .bottom-controls {
            position: absolute;
            bottom: 50px; /* Home indicator boşluğu */
            width: 100%;
            padding: 0 46px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        /* Home Indicator (Sahte) */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 5px;
            background-color: #fff;
            border-radius: 100px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- Tarih ve Saat -->
    <div class="header-container">
        <div class="date">Salı, 25 Ağustos</div>
        <div class="time">20:03</div>
    </div>

    <!-- Sürüklenebilir Widget'lar -->
    <div class="widget" id="widget-spotify" style="top: 250px; left: 50px;">
        <div class="widget-icon">♫</div>
        <div class="widget-text">Spotify</div>
    </div>

    <div class="widget" id="widget-weather" style="top: 250px; left: 160px;">
        <div class="widget-icon">☀️</div>
        <div class="widget-text">24°</div>
    </div>

    <div class="widget" id="widget-prayer" style="top: 250px; left: 260px;">
        <div class="widget-icon">☾</div>
        <div class="widget-text">20:31</div>
    </div>

    <!-- Fener ve Kamera -->
    <div class="bottom-controls">
        <div class="icon-btn">🔦</div>
        <div class="icon-btn">📷</div>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>

    <script>
        // Widget'ları sürüklenebilir yapma fonksiyonu
        function makeDraggable(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            
            // Kaydedilmiş konumu yükle
            const savedX = localStorage.getItem(elmnt.id + '_x');
            const savedY = localStorage.getItem(elmnt.id + '_y');
            
            if (savedX !== null && savedY !== null) {
                elmnt.style.left = savedX + "px";
                elmnt.style.top = savedY + "px";
            }

            // Fare ve Dokunmatik eventleri
            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function dragTouchStart(e) {
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementTouchDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function elementTouchDrag(e) {
                pos1 = pos3 - e.touches[0].clientX;
                pos2 = pos4 - e.touches[0].clientY;
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                // Sürükleme bittiğinde eventleri temizle
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
                
                // Bırakılan yeni konumu localStorage'a kaydet
                localStorage.setItem(elmnt.id + '_x', elmnt.offsetLeft);
                localStorage.setItem(elmnt.id + '_y', elmnt.offsetTop);
            }
        }

        // Tüm widget'lara sürükleme özelliğini tanımla
        makeDraggable(document.getElementById("widget-spotify"));
        makeDraggable(document.getElementById("widget-weather"));
        makeDraggable(document.getElementById("widget-prayer"));
    </script>
</body>
</html>
